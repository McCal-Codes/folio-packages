name: Publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The index says how long it stays fresh, so it has to be rebuilt before it goes stale.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: python3 tools/build.py

      - name: Check every package against Folio's own schemas
        env:
          # The branch the schemas are read from. They arrive on main with Folio 0.7.0; until then this can be
          # pointed at the release branch, and the step says so instead of failing.
          FOLIO_REF: ${{ vars.FOLIO_REF || 'main' }}
        run: |
          pip install --quiet check-jsonschema
          git clone --depth 1 --branch "$FOLIO_REF" https://github.com/McCal-Codes/folio.git /tmp/folio
          schema=/tmp/folio/docs/sdk/schema/v1
          if [ ! -d "$schema" ]; then
            echo "::notice::Folio $FOLIO_REF has no docs/sdk/schema/v1 yet, so packages were only built, not validated."
            exit 0
          fi
          for f in packages/*/manifest.json; do
            [ -e "$f" ] || continue
            check-jsonschema --schemafile "$schema/manifest.schema.json" "$f"
          done
          for f in packages/*/depiction.json; do
            [ -e "$f" ] || continue
            check-jsonschema --schemafile "$schema/depiction.schema.json" "$f"
          done
          check-jsonschema --schemafile "$schema/index.schema.json" site/index.json

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-unsigned
          path: site/

  publish:
    # Signing only ever happens on main: a pull request from anyone must not be able to reach the key.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and sign
        id: sign
        env:
          FOLIO_SIGNING_KEY: ${{ secrets.FOLIO_SIGNING_KEY }}
        run: |
          if [ -z "$FOLIO_SIGNING_KEY" ]; then
            # Not an error: it's the state this repo is in until the key is made. Folio refuses an unsigned source,
            # so publishing an unsigned site would be worse than publishing nothing.
            echo "::notice::No FOLIO_SIGNING_KEY secret yet, so nothing was published. Run tools/keygen.sh, then: gh secret set FOLIO_SIGNING_KEY < folio-source.pem"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$FOLIO_SIGNING_KEY" > key.pem
          python3 tools/build.py --key key.pem
          rm -f key.pem

      - uses: actions/configure-pages@v5
        if: steps.sign.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.sign.outputs.skip != 'true'
        with:
          path: site/
      - id: deploy
        if: steps.sign.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
