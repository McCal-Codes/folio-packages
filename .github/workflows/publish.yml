name: Publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The index says how long it stays fresh, so it has to be rebuilt before it goes stale.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: python3 tools/build.py

      - name: Fetch Folio's validator and schemas, pinned
        env:
          # The exact Folio commit these checks are run against. Bump it on purpose (and the hash with it), so a
          # submission that passed yesterday doesn't fail today because Folio's main moved.
          FOLIO_SHA: 5bb87e66c9bcf9d0ae1324f5f6a9aa764c4c40ab
          FOLIO_PKG_SHA256: e82b605b05b7626d138c0d24feda79f01235e38dad8c1ebb708a0af8c0337ba1
        run: |
          mkdir -p /tmp/folio && cd /tmp/folio
          git init -q && git remote add origin https://github.com/McCal-Codes/folio.git
          git fetch -q --depth 1 origin "$FOLIO_SHA" && git checkout -q FETCH_HEAD
          echo "$FOLIO_PKG_SHA256  tools/folio-pkg.py" | sha256sum -c -

      - name: House rules
        run: python3 tools/check-submission.py

      - name: Check each package with Folio's own validator
        # Each package is checked on its own: its pictures live in its folder, as the template's do.
        run: |
          status=0
          for dir in packages/*/; do
            [ -d "$dir" ] || continue
            tmp=$(mktemp -d)
            cp -r "$dir" "$tmp/"
            FOLIO_SCHEMAS=/tmp/folio/docs/sdk/schema/v1 python3 /tmp/folio/tools/folio-pkg.py validate "$tmp/$(basename "$dir")" || status=1
          done
          exit $status

      - name: Check the template still passes
        run: FOLIO_SCHEMAS=/tmp/folio/docs/sdk/schema/v1 python3 /tmp/folio/tools/folio-pkg.py validate template/hello-tweak

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-unsigned
          path: site/

  publish:
    # Signing only ever happens on main: a pull request from anyone must not be able to reach the key.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and sign
        id: sign
        env:
          FOLIO_SIGNING_KEY: ${{ secrets.FOLIO_SIGNING_KEY }}
        run: |
          if [ -z "$FOLIO_SIGNING_KEY" ]; then
            # Not an error: it's the state this repo is in until the key is made. Folio refuses an unsigned source,
            # so publishing an unsigned site would be worse than publishing nothing.
            echo "::notice::No FOLIO_SIGNING_KEY secret yet, so nothing was published. Run tools/keygen.sh, then: gh secret set FOLIO_SIGNING_KEY < folio-source.pem"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$FOLIO_SIGNING_KEY" > key.pem
          python3 tools/build.py --key key.pem
          rm -f key.pem

      - name: Check the signed site with Folio's own validator
        if: steps.sign.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/folio && cd /tmp/folio
          git init -q && git remote add origin https://github.com/McCal-Codes/folio.git
          git fetch -q --depth 1 origin 5bb87e66c9bcf9d0ae1324f5f6a9aa764c4c40ab && git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          FOLIO_SCHEMAS=/tmp/folio/docs/sdk/schema/v1 python3 /tmp/folio/tools/folio-pkg.py validate site

      - uses: actions/configure-pages@v5
        if: steps.sign.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.sign.outputs.skip != 'true'
        with:
          path: site/
      - id: deploy
        if: steps.sign.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

  # GitHub turns scheduled workflows off after 60 days with no repository activity, and the weekly rebuild would stop
  # with it: the index would pass its maxAge and Folio would refuse the source. Re-enabling through the API resets that
  # clock without a commit. This job holds no secrets and can't touch the repository's contents.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the weekly rebuild scheduled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
